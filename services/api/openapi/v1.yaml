openapi: 3.1.0
info:
  title: Cabugi API
  version: 1.0.0
  description: Initial Cabugi API surface for health checks and published problem access.
components:
  schemas:
    PublishedProblemSummary:
      type: object
      required:
        - slug
        - title
        - timeLimitMs
        - memoryLimitMb
      properties:
        slug:
          type: string
        title:
          type: string
        timeLimitMs:
          type: integer
        memoryLimitMb:
          type: integer
    PublishedProblemDetail:
      allOf:
        - $ref: '#/components/schemas/PublishedProblemSummary'
        - type: object
          required:
            - statementMarkdown
            - inputMarkdown
            - outputMarkdown
            - constraintsMarkdown
            - notesMarkdown
          properties:
            statementMarkdown:
              type: string
            inputMarkdown:
              type: string
            outputMarkdown:
              type: string
            constraintsMarkdown:
              type: string
            notesMarkdown:
              type: string
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: API health check
      operationId: getHealthz
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /openapi/v1.yaml:
    get:
      summary: Versioned OpenAPI document
      operationId: getOpenAPIV1
      responses:
        '200':
          description: OpenAPI contract for the v1 HTTP surface.
          content:
            application/yaml:
              schema:
                type: string
  /v1/me:
    get:
      summary: Current authenticated user
      operationId: getCurrentUser
      security:
        - clerkSession: []
      responses:
        '200':
          description: The current authenticated app user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - subject
                  - handle
                  - displayName
                properties:
                  id:
                    type: string
                  subject:
                    type: string
                  handle:
                    type: string
                  displayName:
                    type: string
        '401':
          description: Missing or invalid session token.
        '503':
          description: Authentication or user bootstrap dependencies are not configured on the API server.
  /v1/problems:
    get:
      summary: List published problems
      operationId: listPublishedProblems
      responses:
        '200':
          description: Published problems visible to users.
          content:
            application/json:
              schema:
                type: object
                required:
                  - problems
                properties:
                  problems:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedProblemSummary'
        '503':
          description: The problem store is not configured.
  /v1/problems/{slug}:
    get:
      summary: Get a published problem by slug
      operationId: getPublishedProblemBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published problem detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedProblemDetail'
        '404':
          description: No published problem exists for the slug.
        '503':
          description: The problem store is not configured.
