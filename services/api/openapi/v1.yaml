openapi: 3.1.0
info:
  title: Cabugi API
  version: 1.0.0
  description: Initial Cabugi API surface for health checks and published problem access.
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: API health check
      operationId: getHealthz
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /openapi/v1.yaml:
    get:
      summary: Versioned OpenAPI document
      operationId: getOpenAPIV1
      responses:
        '200':
          description: OpenAPI contract for the v1 HTTP surface.
          content:
            application/yaml:
              schema:
                type: string
