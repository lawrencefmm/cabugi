openapi: 3.1.0
info:
  title: Cabugi API
  version: 1.0.0
  description: Initial Cabugi API surface for health checks and published problem access.
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: API health check
      operationId: getHealthz
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /openapi/v1.yaml:
    get:
      summary: Versioned OpenAPI document
      operationId: getOpenAPIV1
      responses:
        '200':
          description: OpenAPI contract for the v1 HTTP surface.
          content:
            application/yaml:
              schema:
                type: string
  /v1/me:
    get:
      summary: Current authenticated user
      operationId: getCurrentUser
      security:
        - clerkSession: []
      responses:
        '200':
          description: The current authenticated session subject.
          content:
            application/json:
              schema:
                type: object
                required:
                  - subject
                properties:
                  subject:
                    type: string
        '401':
          description: Missing or invalid session token.
        '503':
          description: Clerk verification is not configured on the API server.
